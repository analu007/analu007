name: Update Profile Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # CHECKOUT
      # ─────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v6

      # ─────────────────────────────────────────────
      # GITHUB STATS
      # ─────────────────────────────────────────────

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=252525&title_color=36ff2f&icon_color=0a5bb6&text_color=fffcf2
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=252525&title_color=36ff2f&text_color=fffcf2
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # SAVE STATS
      # ─────────────────────────────────────────────

      - name: Commit GitHub Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "chore: update github profile stats" || exit 0

          git push

      # ─────────────────────────────────────────────
      # GENERATE SNAKE
      # ─────────────────────────────────────────────

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%2336ff2f&color_dots=%23252525,%230a5bb6,%230a5bb6,%2336ff2f,%2336ff2f
            dist/github-snake-dark.svg?color_snake=%2336ff2f&color_dots=%23252525,%230a5bb6,%230a5bb6,%2336ff2f,%2336ff2f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # DEPLOY SNAKE TO OUTPUT BRANCH
      # ─────────────────────────────────────────────

      - name: Deploy Snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          commit_message: "chore: update contribution snake"
